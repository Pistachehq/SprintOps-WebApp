# OCI DevOps — Deploy pipeline: actualiza imagenes en OKE (namespace sprintops)
# Requiere: Environment de tipo "Cluster" apuntando a sprintops-kq8o-cluster
# y que el stage anterior exporte BACKEND_IMAGE_URI / FRONTEND_IMAGE_URI
# (o usar :latest si solo corres deploy sin rebuild).

version: 0.1
component: deployment
shell: bash
timeoutInSeconds: 1200

env:
  variables:
    K8S_NAMESPACE: "sprintops"
    # Si el deploy pipeline no recibe las URIs del build, usa latest en OCIR:
    BACKEND_IMAGE_URI: "mx-queretaro-1.ocir.io/axf5izecp5nx/sprintops-kq8o-backend:latest"
    FRONTEND_IMAGE_URI: "mx-queretaro-1.ocir.io/axf5izecp5nx/sprintops-kq8o-frontend:latest"

steps:
  - type: Command
    name: Rollout backend and frontend
    command: |
      set -euo pipefail
      echo "Backend image:  ${BACKEND_IMAGE_URI}"
      echo "Frontend image: ${FRONTEND_IMAGE_URI}"

      kubectl -n "${K8S_NAMESPACE}" set image deployment/backend \
        backend="${BACKEND_IMAGE_URI}" --record
      kubectl -n "${K8S_NAMESPACE}" set image deployment/frontend \
        frontend="${FRONTEND_IMAGE_URI}" --record

      kubectl -n "${K8S_NAMESPACE}" rollout status deployment/backend --timeout=600s
      kubectl -n "${K8S_NAMESPACE}" rollout status deployment/frontend --timeout=300s

      kubectl -n "${K8S_NAMESPACE}" get pods,svc
