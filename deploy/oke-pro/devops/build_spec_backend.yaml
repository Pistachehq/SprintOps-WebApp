# OCI DevOps — Build pipeline: backend → OCIR
# Pipeline > Parameters (obligatorio): OCI_AUTH_TOKEN = Auth Token OCIR (tipo Secret)

version: 0.1
component: build
runAs: root
shell: bash
timeoutInSeconds: 3600

env:
  variables:
    OCIR_REGION: "mx-queretaro-1"
    OCIR_NAMESPACE: "axf5izecp5nx"
    OCIR_BACKEND_REPO: "sprintops-kq8o-backend"
    OCIR_USERNAME: "oracleidentitycloudservice/a00838462@tec.mx"

steps:
  - type: Command
    name: Build and push backend image
    command: |
      set -eo pipefail
      echo "=== SprintOps backend build ==="
      echo "Commit: ${OCI_PRIMARY_SOURCE_COMMIT_HASH:-unknown}"
      echo "Source dir: ${OCI_PRIMARY_SOURCE_DIR:-.}"

      SHORT_HASH="${OCI_PRIMARY_SOURCE_COMMIT_HASH:0:7}"
      IMAGE="${OCIR_REGION}.ocir.io/${OCIR_NAMESPACE}/${OCIR_BACKEND_REPO}:${SHORT_HASH}"
      IMAGE_LATEST="${OCIR_REGION}.ocir.io/${OCIR_NAMESPACE}/${OCIR_BACKEND_REPO}:latest"

      # Token: pipeline secret OCI_AUTH_TOKEN o AUTH_TOKEN (como en la UI), o at.cfg en el repo
      AUTH_TOKEN="${OCI_AUTH_TOKEN:-${AUTH_TOKEN:-}}"
      if [ -z "$AUTH_TOKEN" ] && [ -f "${OCI_PRIMARY_SOURCE_DIR}/at.cfg" ]; then
        AUTH_TOKEN="$(tr -d '\n' < "${OCI_PRIMARY_SOURCE_DIR}/at.cfg")"
        echo "Using OCIR token from at.cfg"
      fi
      if [ -z "$AUTH_TOKEN" ]; then
        echo "ERROR: Falta token OCIR (parametro OCI_AUTH_TOKEN o AUTH_TOKEN tipo Secret)."
        echo "  Pipeline > Parameters > Name: OCI_AUTH_TOKEN  Type: Secret"
        exit 1
      fi

      echo "=== docker build ==="
      df -h / /var/tmp 2>/dev/null || true
      docker version 2>/dev/null || true
      cd "${OCI_PRIMARY_SOURCE_DIR}/backend"
      if [ ! -f Dockerfile.devops ]; then
        echo "ERROR: falta backend/Dockerfile.devops — haz git push y Sync del mirror."
        exit 1
      fi
      # Sin --platform ni DOCKER_BUILDKIT=0 (en DevOps a veces provoca exit 125)
      docker build --progress=plain -f Dockerfile.devops -t "sprintops-backend:${SHORT_HASH}" .

      echo "=== docker login OCIR ==="
      LOGIN_OK=false
      for U in \
        "${OCIR_NAMESPACE}/${OCIR_USERNAME}" \
        "${OCIR_NAMESPACE}/oracleidentitycloudservice/${OCIR_USERNAME#*/}" \
        "${OCIR_NAMESPACE}/a00838462@tec.mx"; do
        echo "Trying login user: $U"
        if echo "$AUTH_TOKEN" | docker login "${OCIR_REGION}.ocir.io" -u "$U" --password-stdin; then
          LOGIN_OK=true
          break
        fi
      done
      if [ "$LOGIN_OK" != "true" ]; then
        echo "ERROR: docker login fallo. Revisa OCI_AUTH_TOKEN y OCIR_USERNAME."
        exit 1
      fi

      echo "=== docker push ==="
      docker tag "sprintops-backend:${SHORT_HASH}" "${IMAGE}"
      docker tag "sprintops-backend:${SHORT_HASH}" "${IMAGE_LATEST}"
      docker push "${IMAGE}"
      docker push "${IMAGE_LATEST}"
      echo "Pushed ${IMAGE}"
      echo "BUILD OK — imagen en OCIR: ${IMAGE}"
      # Sin outputArtifacts: evita INTERNAL_ERROR en "Save output artifacts".
      # La imagen ya quedo en OCIR por docker push; el deploy puede usar :latest o el tag del commit.
