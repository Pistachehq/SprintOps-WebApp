spring.application.name=sprintops-backend

# Fotos del daily en cronograma (multipart)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Configuracion del servidor
server.port=8080

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sprintops_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Spring Boot también lee la variable de entorno SPRING_DATASOURCE_PASSWORD (tiene prioridad sobre esta línea).
spring.datasource.password=Ammy281106
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

