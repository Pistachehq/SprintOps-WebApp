spring.application.name=sprintops-backend

# Carga opcional de secretos solo en tu máquina (archivo ignorado por Git). Ahí pon GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET.
spring.config.import=optional:classpath:application-local.properties

# Fotos del daily en cronograma (multipart)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Configuracion del servidor
server.port=8080

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sprintops_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Spring Boot también lee la variable de entorno SPRING_DATASOURCE_PASSWORD (tiene prioridad sobre esta línea).
spring.datasource.password=Ammy281106
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Groq (chatbot Pistache). Prioridad: variable de entorno GROQ_API_KEY.
groq.api.key=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
groq.model=llama-3.3-70b-versatile

# Portadas de cards de proyecto (disco; visibles para todo el equipo)
app.project-card-cover-dir=uploads/project-card-covers

# Google OAuth2: variables GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET (Render / terminal) o en application-local.properties.
# Sin ellas, el login con Google no se registra (ver toast en el front).

# Registro / verificación de correo (enlace en el email apunta al frontend)
app.frontend-base-url=http://localhost:5173
app.mail.from=noreply@localhost

# Opcional: descomenta y configura para enviar correos reales
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# SQL initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
