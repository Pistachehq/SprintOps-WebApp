# Perfil "prod" para despliegue en Kubernetes / OCI. Lee todo de variables de entorno.
# Se activa con SPRING_PROFILES_ACTIVE=prod (lo hace el Dockerfile/Deployment).

spring.config.import=

# Base de datos (la inyecta Kubernetes vía Secret)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Servidor
server.port=8080
server.forward-headers-strategy=framework

# Multipart (fotos del daily)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# URL pública del frontend (la pone el ConfigMap)
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost}
app.mail.from=${MAIL_FROM:noreply@localhost}

# Mail (opcional)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Carpeta de portadas (volumen montado)
app.project-card-cover-dir=${PROJECT_CARD_COVER_DIR:/data/project-card-covers}

# Groq (chatbot Pistache). Si está vacío, el chatbot queda deshabilitado.
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

# Telegram (opcional)
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}

# OAuth2 (opcional): NO declarar spring.security.oauth2.client.registration.* aqui.
# Con client-id vacio, Spring Boot 4 falla al arrancar. Los registros se crean solo si hay
# GOOGLE_CLIENT_* / GITHUB_CLIENT_* en OAuth2ClientRegistrationsConfig (@Conditional).
