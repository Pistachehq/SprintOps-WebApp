# Perfil "oracle" para despliegue contra Oracle Autonomous Database en OKE.
# Se activa con SPRING_PROFILES_ACTIVE=prod,oracle (lo hace el Deployment de K8s).
# Hereda casi todo de application-prod.properties; solo sobrescribe la conexion a la base.

# Datasource Oracle. La URL la inyecta el ConfigMap como DB_URL con la forma:
#   jdbc:oracle:thin:@SPRINTOPSDB_high?TNS_ADMIN=/oracle/wallet
# Donde /oracle/wallet es el directorio donde Kubernetes monta el wallet (Secret).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones moderado (ATP free admite hasta 20 conexiones simultaneas con TNS *_high)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Hibernate: dialecto Oracle. ddl-auto=update deja que Hibernate cree/ajuste tablas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Seed data.sql adaptado a Oracle (los INSERT IGNORE de MySQL no existen aqui, se usa MERGE).
# Forzamos data-locations para que solo cargue el archivo Oracle, no el de MySQL.
spring.sql.init.mode=always
spring.sql.init.platform=oracle
spring.sql.init.data-locations=classpath:data-oracle.sql,classpath:data-oracle-springai.sql
spring.jpa.defer-datasource-initialization=true
