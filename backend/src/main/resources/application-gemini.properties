# Reto D4 — activar solo con perfil gemini (+ GOOGLE_GENAI_API_KEY).
# Local:  GOOGLE_GENAI_API_KEY=xxx mvn spring-boot:run -Dspring-boot.run.profiles=gemini
# OKE:    SPRING_PROFILES_ACTIVE=prod,oracle,gemini
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=${GOOGLE_GENAI_CHAT_MODEL:gemini-2.0-flash}
