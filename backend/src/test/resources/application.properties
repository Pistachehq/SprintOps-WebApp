# Sobrescribe la configuración principal durante mvn test (H2 en memoria).
spring.application.name=sprintops-backend-test
spring.datasource.url=jdbc:h2:mem:reto_release_it;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.config.import=
groq.api.key=
spring.mail.host=127.0.0.1
spring.mail.port=3025
spring.mail.properties.mail.smtp.connectiontimeout=500
spring.mail.properties.mail.smtp.timeout=500
spring.mail.properties.mail.smtp.writetimeout=500
