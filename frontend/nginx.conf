upstream sprintops_backend {
    # Resolución por DNS de Kubernetes: <service>.<namespace>.svc.cluster.local
    server backend.sprintops.svc.cluster.local:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 16m;

    # Gzip básico
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: cualquier ruta cae al index.html
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash de Vite
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Proxy al backend (REST)
    location /api/ {
        proxy_pass http://sprintops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # OAuth2 (login Google/GitHub)
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://sprintops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
