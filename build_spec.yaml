# Raiz del repo — mismo spec que deploy/oke-pro/devops/build_spec_backend.yaml (Reto D3 PDF)

version: 0.1
component: build
runAs: root
shell: bash
timeoutInSeconds: 3600

env:
  variables:
    OCIR_REGION: "mx-queretaro-1"
    OCIR_NAMESPACE: "axf5izecp5nx"
    OCIR_BACKEND_REPO: "sprintops-kq8o-backend"
    OCIR_USERNAME: "oracleidentitycloudservice/a00838462@tec.mx"
  exportedVariables:
    - BACKEND_IMAGE_URI

steps:
  - type: Command
    name: Build and push backend image
    command: |
      set -eo pipefail
      echo "=== SprintOps backend build ==="
      SHORT_HASH="${OCI_PRIMARY_SOURCE_COMMIT_HASH:0:7}"
      IMAGE="${OCIR_REGION}.ocir.io/${OCIR_NAMESPACE}/${OCIR_BACKEND_REPO}:${SHORT_HASH}"
      IMAGE_LATEST="${OCIR_REGION}.ocir.io/${OCIR_NAMESPACE}/${OCIR_BACKEND_REPO}:latest"

      AUTH_TOKEN="${OCI_AUTH_TOKEN:-${AUTH_TOKEN:-}}"
      if [ -z "$AUTH_TOKEN" ] && [ -f "${OCI_PRIMARY_SOURCE_DIR}/at.cfg" ]; then
        AUTH_TOKEN="$(tr -d '\n' < "${OCI_PRIMARY_SOURCE_DIR}/at.cfg")"
      fi
      if [ -z "$AUTH_TOKEN" ]; then
        echo "ERROR: Agrega parametro secreto OCI_AUTH_TOKEN al pipeline."
        exit 1
      fi

      cd "${OCI_PRIMARY_SOURCE_DIR}/backend"
      export DOCKER_BUILDKIT=0
      docker build --progress=plain --platform linux/amd64 \
        -f Dockerfile.devops -t "sprintops-backend:${SHORT_HASH}" .

      LOGIN_OK=false
      for U in "${OCIR_NAMESPACE}/${OCIR_USERNAME}" "${OCIR_NAMESPACE}/a00838462@tec.mx"; do
        if echo "$AUTH_TOKEN" | docker login "${OCIR_REGION}.ocir.io" -u "$U" --password-stdin; then
          LOGIN_OK=true; break
        fi
      done
      [ "$LOGIN_OK" = "true" ] || { echo "ERROR: docker login"; exit 1; }

      docker tag "sprintops-backend:${SHORT_HASH}" "${IMAGE}"
      docker tag "sprintops-backend:${SHORT_HASH}" "${IMAGE_LATEST}"
      docker push "${IMAGE}"
      docker push "${IMAGE_LATEST}"

      EXPORT_FILE="${OCI_DEVOPS_EXPORT_VARIABLES_FILE:-${OCI_WORKSPACE_DIR}/exportedVariables}"
      mkdir -p "$(dirname "$EXPORT_FILE")"
      echo "BACKEND_IMAGE_URI=${IMAGE}" >> "$EXPORT_FILE"

outputArtifacts:
  - name: sprintops_backend_image
    type: DOCKER_IMAGE
    location: ${BACKEND_IMAGE_URI}
